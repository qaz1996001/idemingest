[project]
name = "idemingest"
version = "0.1.0"
description = "Idempotent sensor-data ingestion: replay safety instead of exactly-once delivery"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
